name: Build and Publish arm64 Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像 Tag 标签 (例如: latest, v0.2.30)'
        required: false
        default: 'latest'
        type: string
      dockerhub_username:
        description: 'Docker Hub 用户名'
        required: false
        default: '${{ github.repository_owner }}'
        type: string
      dockerhub_image:
        description: 'Docker Hub 镜像名 (不含 tag)'
        required: false
        default: 'yyb-go-enhanced'
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'
      - 'cmd/**'
      - 'internal/**'
      - 'resource/**'
      - '.github/workflows/docker-publish.yml'

permissions:
  contents: read

concurrency:
  group: docker-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository with Retry
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          for attempt in 1 2 3; do
            if git fetch --depth=1 origin "$GITHUB_SHA" && git checkout --force --detach FETCH_HEAD; then
              exit 0
            fi
            [[ "$attempt" == 3 ]] && exit 1
            sleep $((attempt * 10))
          done

      - name: Prepare Image Tags
        id: meta
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_DOCKERHUB_IMAGE: ${{ inputs.dockerhub_image }}
        run: |
          set -Eeuo pipefail
          image_name="$INPUT_DOCKERHUB_IMAGE"
          [[ -n "$image_name" ]] || image_name="yyb-go-enhanced"
          [[ "$image_name" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || {
            echo "Invalid Docker Hub image name: $image_name" >&2
            exit 2
          }
          image="docker.io/$image_name"
          tags=()

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            image_tag="${INPUT_IMAGE_TAG:-latest}"
            [[ "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
              echo "Invalid image tag: $image_tag" >&2
              exit 2
            }
            tags+=("$image:$image_tag")
            if [[ "$image_tag" != "latest" ]]; then
              tags+=("$image:latest")
            fi
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags+=("$image:$version")
            [[ "$version" == *-* ]] || tags+=("$image:latest")
          else
            branch_tag="${GITHUB_REF_NAME//\//-}"
            tags+=("$image:$branch_tag" "$image:latest")
          fi

          {
            echo "image=$image"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}" | awk '!seen[$0]++'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up arm64 Builder
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            if docker run --privileged --rm tonistiigi/binfmt:qemu-v9.2.2 --install arm64; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "QEMU setup failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

          docker buildx create --name yyb-builder --driver docker-container --use
          for attempt in 1 2 3; do
            if docker buildx inspect --bootstrap; then
              exit 0
            fi
            [[ "$attempt" == 3 ]] && exit 1
            sleep $((attempt * 10))
          done

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ inputs.dockerhub_username || github.repository_owner }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${DOCKERHUB_TOKEN:-}" ]]; then
            echo "::error::Missing secret DOCKERHUB_TOKEN. Add it under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          for attempt in 1 2 3; do
            if printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io \
              -u "$DOCKERHUB_USERNAME" --password-stdin; then
              exit 0
            fi
            [[ "$attempt" == 3 ]] && exit 1
            sleep $((attempt * 10))
          done

      - name: Build and Push arm64 Image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -Eeuo pipefail
          mapfile -t tags <<< "$IMAGE_TAGS"
          tag_args=()
          for tag in "${tags[@]}"; do
            [[ -n "$tag" ]] && tag_args+=(--tag "$tag")
          done

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            build_version="${GITHUB_REF_NAME#v}"
          else
            build_version="$(tr -d '[:space:]' < VERSION)"
          fi

          for attempt in 1 2 3; do
            if docker buildx build \
              --file ./Dockerfile \
              --build-arg VERSION="$build_version" \
              --build-arg COMMIT="$GITHUB_SHA" \
              --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --platform linux/arm64 \
              --push \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              "${tag_args[@]}" \
              .; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "Docker build failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done